# An example midgard configuration. Copy it to config.yml in one of the places
# midgard looks (see docs/install.md#configuration) and fill in your own values.
# Never commit the real file: it holds your server's password.

---
# midgard common settings
title: "midgard"
domain: example.com # domain that runs midgard server

# midgard server settings
# these settings are only used in server mode (run under `mg server`)
server:
  addr: 0.0.0.0:80
  mode: release # or debug/test
  store: # data folder is in ./data
    prefix: /midgard # access via example.com/midgard/*
    backup:
      enable: false # enable backup to a git repository
      interval: 60 # in minutes
      repo: https://github.com/you/midgard-data.git
  auth:
    # the following two configure your midgard credentials. The server refuses
    # to start while the password is empty or still this placeholder.
    user: midgard
    pass: change-me
  # networks whose X-Forwarded-For header is believed, for a reverse proxy in
  # front of midgard. Empty means loopback and the private networks.
  trusted_proxies: []

# midgard daemon settings
# these settings are only used in daemon mode (run under `mg daemon run`)
daemon:
  addr: localhost:9125
