version: "3"
services:
  midgard:
    container_name: midgard
    restart: always
    image: midgard:latest
    volumes:
      - ./data:/app/data
      # the configuration stays out of the image
      - ./config.yml:/app/config.yml:ro
    env_file: .env # AUTH_URL and AUTH_ALLOWED_PRINCIPALS; see .env.template
    environment:
      MIDGARD_SERVER_ADDR: midgard:80
    cap_add:
      - SYS_PTRACE # for debugging
    networks:
      - traefik_proxy
networks:
  traefik_proxy:
    external: true
