# Builds the server's container image. A version tag publishes it for amd64
# and arm64 to ghcr.io; a pull request that touches the image only builds it,
# for amd64, so a broken Dockerfile shows up before a release does.

name: image

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths: [ 'Dockerfile', '.dockerignore', '.github/workflows/image.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # to push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # git describe needs the tags
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Log in to ghcr.io
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Work out the version and tags
      id: meta
      run: |
        echo "version=$(git describe --always --tags)" >> "$GITHUB_OUTPUT"
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        echo "tags=${image}:${GITHUB_REF_NAME},${image}:latest" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@v6
      with:
        context: .
        build-args: VERSION=${{ steps.meta.outputs.version }}
        platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: ${{ startsWith(github.ref, 'refs/tags/v') }}
        tags: ${{ steps.meta.outputs.tags }}
